# メッセージの言語（ja = 日本語、en = 英語、zh = 簡体字中国語）
lang: 'ja'

# 対戦の開始と終了を、サーバー全体メッセージで通知するかどうか
broadcastSessionStartEnd: true

# ゲームの開始を禁止するワールド。
# 例えば、prohibitWorlds: ['sozai']  のように指定すると、sozaiワールドではゲームを開始できなくなります。
prohibitWorlds: []

# ゲーム終了してから、テレポートして元の場所に戻るまでの、待ち時間（秒）
sessionEndWaitSeconds: 15

# 1手にかけられる制限時間（秒）。時間切れになったプレイヤーは、投了扱いで敗北します。
# 0 を指定すると、制限時間なしになります。
turnTimeLimitSeconds: 600

# ターンが切り替わったときに再生する効果音。
# 音の名前は、/playsound コマンドの補完で調べることができます。
# カンマに続けて、ピッチ（0.5 - 2.0）を指定することもできます。
# '' を指定すると、効果音を鳴らしません。
yourTurnSound: 'block.note_block.pling,2.0'
otherTurnSound: 'block.note_block.hat,1.0'

# 対局中に切断したプレイヤーの再接続を待つ時間（秒）。
# この時間を過ぎても再接続しない場合、投了として扱われます。
disconnectWaitSeconds: 30

# インベントリ切り替えシステムを使用するかどうか。
enableTemporaryInventory: false


# -------------------- 掛け金報酬設定 --------------------

# 掛け金や賞金の機能を使用するかどうか。
# NONE -> 使用しない
# ITEM -> 掛け金や報酬をアイテムで設定する
# ECO -> 掛け金や報酬を経済プラグインのお金で設定する。
#        Vaultと、連携可能な経済プラグインの導入が必要です。
betRewardType: NONE

# 掛けアイテム、報酬アイテムの設定
versusBetItem: DIAMOND
versusRewardItem: DIAMOND-2
easyBetItem: WOOD-2
easyRewardItem: WOOD-5
normalBetItem: IRON_INGOT-2
normalRewardItem: IRON_INGOT-5
hardBetItem: DIAMOND-2
hardRewardItem: DIAMOND-5

# 掛け金、報酬金の設定
versusBetEco: 10
versusRewardEco: 20
easyBetEco: 3
easyRewardEco: 7
normalBetEco: 5
normalRewardEco: 12
hardBetEco: 8
hardRewardEco: 19
